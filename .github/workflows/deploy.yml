name: Deploy

# Runs after CI passes on main. Uses GitHub OIDC (no stored AWS keys) and
# AWS Systems Manager (no open SSH port) to redeploy the container on EC2.
# Skips cleanly until the repo variables below are set.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # needed for OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      vars.AWS_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Redeploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          SCRIPT=$(cat <<'EOS'
          set -e
          sudo -u ec2-user bash -lc '
            cd /home/ec2-user/app
            git pull --ff-only
            docker build -t todo .
            docker rm -f todo || true
            docker run -d --name todo --restart unless-stopped -p 80:8000 --env-file .env todo
          '
          for i in $(seq 1 15); do
            curl -sf http://localhost/health && exit 0
            sleep 2
          done
          echo "Health check failed after deploy"
          docker logs todo || true
          exit 1
          EOS
          )
          jq -n --arg s "$SCRIPT" '{commands: [$s]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "CMD_ID=$CMD_ID" >> "$GITHUB_ENV"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"

      - name: Show deploy output
        if: always()
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          [ -n "$CMD_ID" ] && aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text || true
