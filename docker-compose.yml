# Local development only: app + throwaway Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: localdevonly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todos"]
      interval: 3s
      retries: 10
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DB_HOST: db
      DB_USER: todo
      DB_PASSWORD: localdevonly
      DB_NAME: todos
    depends_on:
      db: {condition: service_healthy}
